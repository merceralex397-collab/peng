[package]
name = "peng"
version = "0.1.0"
description = "A local-first library for reusable AI assets"
authors = ["Peng contributors"]
edition = "2024"

[lib]
name = "peng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }

